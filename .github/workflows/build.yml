name: EX-word modular shell
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit and syntax tests
        run: bash tests/run.sh
  exword-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/Edelweiss
          ref: feature/elf-read-cache-benchmark
          path: dependencies/edelweiss
      - uses: actions/checkout@v4
        with:
          repository: TheRainbowPhoenix/exword-xd-a8500-TEST
          path: dependencies/metadata
      - name: Install fxSDK EX-word toolchain and D01 packaging tool
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword https://github.com/TheRainbowPhoenix/fxsdk-exword.git /tmp/fxsdk-src
          cmake -S /tmp/fxsdk-src -B /tmp/fxsdk-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/fxsdk-exword \
            -DFXLINK_DISABLE_SDL2=ON -DFXLINK_DISABLE_UDISKS2=ON
          cmake --build /tmp/fxsdk-build --parallel 2
          cmake --install /tmp/fxsdk-build
          git clone --depth=1 https://github.com/brijohn/elf2d01.git /tmp/elf2d01
          cc -O2 /tmp/elf2d01/elf2d01.c -o /tmp/fxsdk-exword/bin/elf2d01
          echo /tmp/fxsdk-exword/bin >> "$GITHUB_PATH"
      - name: Install gint EX-word runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exword https://github.com/TheRainbowPhoenix/gint-exword.git /tmp/gint-src
          cmake -S /tmp/gint-src -B /tmp/gint-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/gint-exword \
            -DCMAKE_MODULE_PATH=/tmp/fxsdk-exword/lib/cmake/fxsdk
          cmake --build /tmp/gint-build --parallel 2
          cmake --install /tmp/gint-build
      - name: Configure and compile shell + applet packs
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_PREFIX_PATH=/tmp/gint-exword \
            '-DCMAKE_MODULE_PATH=/tmp/gint-exword/lib/cmake/fxsdk;/tmp/fxsdk-exword/lib/cmake/fxsdk' \
            -DFETCHCONTENT_SOURCE_DIR_EDELWEISS="$GITHUB_WORKSPACE/dependencies/edelweiss" \
            -DEXWORD_METADATA_SOURCE="$GITHUB_WORKSPACE/dependencies/metadata"
          cmake --build build --parallel 2
          python3 tools/check_package.py build
      - uses: actions/upload-artifact@v4
        with:
          name: Toybox-ja
          path: build/packages/ja/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Toybox-cn
          path: build/packages/cn/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Toybox-debug
          path: |
            build/*.d01
            build/*.edl
            build/*.map
          if-no-files-found: warn
